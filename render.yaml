services:
  - type: web
    name: sidescan-sonar-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: MAX_CACHED_MODELS
        value: "1"
      - key: CPU_MAX_IMAGE_SIZE
        value: "480"
      - key: TORCH_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: HF_SPACE_ID
        value: "Ksh508/SSS"
      - key: USE_REMOTE_INFERENCE
        value: "true"
      - key: HF_TOKEN
        sync: false
      # Optional Managed Persistence (Populate in Render Dashboard to persist analyses across dyno reboots):
      # - key: DATABASE_URL
      #   sync: false
      # - key: STORAGE_PROVIDER
      #   value: local # change to 'supabase' when keys are added
      # - key: SUPABASE_URL
      #   sync: false
      # - key: SUPABASE_SERVICE_ROLE_KEY
      #   sync: false
