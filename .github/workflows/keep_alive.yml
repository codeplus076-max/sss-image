name: Keep Render Backend Awake

on:
  schedule:
    # Run every 14 minutes to prevent Render free-tier from sleeping (15-min timeout)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          echo "Sending keep-alive ping to Render backend..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "https://sidescan-sonar-backend.onrender.com/api/v1/health" || echo "000")
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "[✓] Backend is awake and healthy!"
          else
            echo "[!] Ping sent (backend may be spinning up or responding with $HTTP_STATUS)"
          fi
